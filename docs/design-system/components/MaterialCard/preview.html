<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font-sans);word-break:keep-all}
.wrap{padding:24px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.cap{font-size:12px;color:var(--ink-muted);font-weight:500}
.dr-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-pill);font-family:inherit;cursor:pointer;text-decoration:none;transition:transform .2s ease,background-color .2s ease,box-shadow .2s ease,opacity .2s ease}
.dr-btn:active:not(:disabled){transform:scale(0.98)}
.dr-btn:disabled{cursor:default;opacity:.4;box-shadow:none}
.btn-primary{height:var(--control-lg);width:var(--button-width);border:0;background:var(--leaf-green);color:var(--white);font-size:18px;font-weight:500;box-shadow:var(--shadow-cta)}
.btn-primary:hover:not(:disabled){background:var(--leaf-green-hover)}
.btn-secondary{height:var(--control-lg);width:var(--button-width);border:1.5px solid var(--leaf-green);background:var(--white);color:var(--leaf-green);font-size:16px;font-weight:500}
.btn-secondary:hover:not(:disabled){background:var(--pale-lime)}
.btn-scene{height:var(--control-lg);width:var(--button-width);border:1px solid rgba(31,42,34,0.14);background:var(--white);color:var(--ink);font-size:16px;font-weight:500;box-shadow:var(--shadow-scene)}
.btn-scene:hover{transform:translateY(-2px);box-shadow:var(--shadow-scene-hover)}
.badge{display:inline-flex;align-items:center;height:var(--control-sm);padding:0 16px;border-radius:var(--radius-pill);font-size:14px;font-weight:600}
.badge.sm{height:var(--badge-sm);padding:0 12px}
.badge-lime{background:var(--lime);color:var(--leaf-green)}
.badge-sand{background:var(--sand);color:var(--soil-ink)}
.ph{display:flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);background:var(--pale-lime);border:1px dashed var(--placeholder-line);font-size:14px;color:var(--ink-muted)}
.ph-sand{display:flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);background:var(--sand);font-size:14px;color:var(--soil-ink)}
.dr-card{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.dr-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.dsp{font-family:var(--font-display);font-weight:400;margin:0}
h3,p{margin:0}
@media (prefers-reduced-motion: reduce){.dr-btn,.dr-card{transition:none}}
</style></head><body>
<div class="wrap"><div style="display:grid;grid-template-columns:repeat(3,200px);gap:24px">
<div class="dr-card" style="display:flex;flex-direction:column;border-radius:var(--radius-xl);background:var(--white);overflow:hidden;border:2px solid var(--leaf-green);box-shadow:var(--shadow-selected)">
<button type="button" aria-label="상토 한 스쿱 더 담기" style="display:flex;flex-direction:column;gap:10px;padding:16px 16px 12px;border:0;background:transparent;text-align:left;font-family:inherit;cursor:pointer"><span style="height:72px;border-radius:var(--radius-lg);background:var(--pale-lime);display:flex;align-items:center;justify-content:center"><span aria-hidden="true" style="width:56px;height:40px;border-radius:28px 28px 12px 12px;background:var(--soil-sangto)"></span></span><span style="font-size:18px;font-weight:600;color:var(--ink)">상토</span><span style="font-size:14px;line-height:1.5;color:var(--ink-muted)">영양과 보습을 함께</span></button>
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px 16px"><button type="button" class="dr-btn" aria-label="상토 한 스쿱 빼기" style="width:32px;height:32px;padding:0;border:1.5px solid var(--leaf-green);background:var(--white);color:var(--leaf-green);font-size:18px">−</button><span style="font-size:16px;font-weight:600;color:var(--leaf-green)">2 스쿱</span><button type="button" class="dr-btn" aria-label="상토 한 스쿱 더 담기" style="width:32px;height:32px;padding:0;border:0;background:var(--leaf-green);color:var(--white);font-size:18px">+</button></div></div>
<div class="dr-card" style="display:flex;flex-direction:column;border-radius:var(--radius-xl);background:var(--white);overflow:hidden;border:2px solid var(--line)">
<button type="button" aria-label="펄라이트 한 스쿱 더 담기" style="display:flex;flex-direction:column;gap:10px;padding:16px 16px 12px;border:0;background:transparent;text-align:left;font-family:inherit;cursor:pointer"><span style="height:72px;border-radius:var(--radius-lg);background:var(--pale-lime);display:flex;align-items:center;justify-content:center"><span aria-hidden="true" style="width:56px;height:40px;border-radius:28px 28px 12px 12px;background:var(--soil-perlite);box-shadow:inset 0 0 0 1.5px var(--soil-perlite-edge)"></span></span><span style="font-size:18px;font-weight:600;color:var(--ink)">펄라이트</span><span style="font-size:14px;line-height:1.5;color:var(--ink-muted)">숨구멍을 만들어요</span></button>
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px 16px"><button type="button" class="dr-btn" disabled aria-label="펄라이트 한 스쿱 빼기" style="width:32px;height:32px;padding:0;border:1.5px solid var(--leaf-green);background:var(--white);color:var(--leaf-green);font-size:18px">−</button><span style="font-size:16px;font-weight:600;color:var(--ink-faint)">0 스쿱</span><button type="button" class="dr-btn" aria-label="펄라이트 한 스쿱 더 담기" style="width:32px;height:32px;padding:0;border:0;background:var(--leaf-green);color:var(--white);font-size:18px">+</button></div></div>
<div class="dr-card" style="display:flex;flex-direction:column;border-radius:var(--radius-xl);background:var(--white);overflow:hidden;border:2px solid var(--line)">
<button type="button" aria-label="훈탄 한 스쿱 더 담기" style="display:flex;flex-direction:column;gap:10px;padding:16px 16px 12px;border:0;background:transparent;text-align:left;font-family:inherit;cursor:pointer"><span style="height:72px;border-radius:var(--radius-lg);background:var(--pale-lime);display:flex;align-items:center;justify-content:center"><span aria-hidden="true" style="width:56px;height:40px;border-radius:28px 28px 12px 12px;background:var(--soil-huntan)"></span></span><span style="font-size:18px;font-weight:600;color:var(--ink)">훈탄</span><span style="font-size:14px;line-height:1.5;color:var(--ink-muted)">뿌리 썩음을 줄여요</span></button>
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px 16px"><button type="button" class="dr-btn" disabled aria-label="훈탄 한 스쿱 빼기" style="width:32px;height:32px;padding:0;border:1.5px solid var(--leaf-green);background:var(--white);color:var(--leaf-green);font-size:18px">−</button><span style="font-size:16px;font-weight:600;color:var(--ink-faint)">0 스쿱</span><button type="button" class="dr-btn" aria-label="훈탄 한 스쿱 더 담기" style="width:32px;height:32px;padding:0;border:0;background:var(--leaf-green);color:var(--white);font-size:18px">+</button></div></div>
</div></div>
</body></html>
