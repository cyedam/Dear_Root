<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
html,body{margin:0;height:100%}
body{position:relative;width:960px;height:288px;background:var(--white);overflow:hidden;font-family:var(--font-sans)}
.art{position:absolute;left:480px;top:0;width:480px;height:288px}
.pale{fill:var(--pale-lime)}.green{fill:var(--leaf-green)}.lime{fill:var(--lime)}.sand{fill:var(--sand)}.white{fill:var(--white)}
.root{stroke:var(--white);stroke-width:4;stroke-linecap:round;fill:none;opacity:.75}
.vein{stroke:var(--leaf-green);stroke-width:2;fill:none}
.txt{position:absolute;left:48px;bottom:40px;max-width:440px}
.name{margin:0;font-family:var(--font-display);font-weight:400;font-size:64px;line-height:.98;letter-spacing:-0.01em;color:var(--ink)}
.tag{margin:16px 0 0;font-size:14px;line-height:1.5;color:var(--ink-muted)}
</style></head><body>
<svg class="art" viewBox="0 0 480 288" aria-hidden="true">
<!--
blocks: pale-lime field 480×288 (relief ground of the art box); sand pot 288×216 with radius-xl corners on top and a 120 half-round bottom (P1 pot shape); leaf-green slab 120×168 radius-xl bleeding off the top; lime disc r=40 (radius-pill).
arrangement: one tall leaf-green slab with satellites — the sand pot sits low-right and bleeds off the bottom edge, like the P1 soil scene.
pattern: literal motif (leaf) — the README calls the brand "잎이 보내는 신호 … 뿌리부터", so five copies of the P1 leaf silhouette in lime / white / leaf-green plus three root strokes inside the pot.
scales: space-6 24 and space-12 48 offsets, radius-xl 20, radius-pill for the disc and leaves' rounded tips; leaf stroke 2 as in P1 veins.
-->
<rect class="pale" x="0" y="0" width="480" height="288"/>
<rect class="green" x="72" y="-20" width="120" height="188" rx="20"/>
<path class="sand" d="M216 120 Q216 100 236 100 L484 100 L484 360 L336 360 Q216 360 216 240 Z"/>
<path class="root" d="M350 100 L350 270 M350 150 C 330 190 300 210 272 222 M350 170 C 372 205 400 222 440 230"/>
<circle class="lime" cx="432" cy="48" r="40"/>
<g transform="translate(96 40) scale(.36)"><path class="white" d="M20 180 C 30 90, 100 30, 185 20 C 175 110, 110 170, 20 180 Z"/></g>
<g transform="translate(232 -6) scale(.62)"><path class="lime" d="M20 180 C 30 90, 100 30, 185 20 C 175 110, 110 170, 20 180 Z"/><path class="vein" d="M24 176 C 80 120, 130 70, 180 24"/></g>
<g transform="translate(24 288) rotate(-90) scale(.5)"><path class="lime" d="M20 180 C 30 90, 100 30, 185 20 C 175 110, 110 170, 20 180 Z"/></g>
<g transform="translate(480 214) scale(-.38 .38)"><path class="green" d="M20 180 C 30 90, 100 30, 185 20 C 175 110, 110 170, 20 180 Z"/></g>
</svg>
<div class="txt"><h1 class="name">Dear Root<br>디자인 시스템</h1><p class="tag">잎이 보내는 신호를 읽고 뿌리부터 다시 돌보는 맞춤 케어</p></div>
</body></html>
