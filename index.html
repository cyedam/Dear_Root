<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dear Root</title>
    <link rel="icon" href="/favicon/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- 마우스를 따라다니는 몬스테라 잎 커서 (docs/assets/cursor → public/cursor, 답변 2026-11-16)
         PC에서만 켜짐 · 터치 기기 · '동작 줄이기' 설정에서는 꺼짐. 메인은 월페이퍼 버튼 옆, 다른 페이지는 화면 오른쪽 아래 작은 버튼으로 끌 수 있음 -->
    <script src="/cursor/monstera/theme.js"></script>
    <script src="/cursor/puffy-web-cursor.js"></script>
    <script>
      // 터치 기기(휴대폰 · 태블릿)에서는 켜지 않음: 주로 쓰는 입력이 마우스(가리키기 + 올리기)인 기기에서만 (답변 2026-11-16)
      window.__puffyCursorReady =
        matchMedia('(hover: hover) and (pointer: fine)').matches && PuffyCursor.init({ theme: 'monstera', toggleCorner: 'right' });
    </script>
  </body>
</html>
